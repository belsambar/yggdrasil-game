<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGGDRASIL — Armée & Combat</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0a04;--parch:#d4b896;--parch-dim:#8a7055;--parch-light:#f0dfc0;--gold:#c8960c;--gold-light:#f0c040;--gold-glow:rgba(200,150,12,.5);--blood:#8b1a1a;--blood-bright:#e74c3c;--frost:#4a9abb;--moss:#4a7a35;--moss-light:#6aaa50;--purple:#8e44ad;--border:rgba(200,150,12,.22);--panel:rgba(14,10,4,.95)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'IM Fell English',Georgia,serif;background:var(--ink);color:var(--parch);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 30% 70%,rgba(139,26,26,.07) 0%,transparent 55%),radial-gradient(ellipse at 70% 30%,rgba(200,150,12,.05) 0%,transparent 55%),#0e0a04}
.bg-rune{position:absolute;font-size:7rem;opacity:.018;color:var(--gold);animation:rf 18s ease-in-out infinite;pointer-events:none}
@keyframes rf{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(4deg)}}
#topbar{position:relative;z-index:100;background:rgba(8,5,1,.97);border-bottom:1px solid var(--border);padding:.4rem .9rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;box-shadow:0 2px 20px rgba(0,0,0,.8)}
.logo{font-family:'Uncial Antiqua',serif;font-size:1.15rem;color:var(--gold);letter-spacing:3px;text-shadow:0 0 15px var(--gold-glow);text-decoration:none;flex-shrink:0}
.logo span{font-size:.52rem;display:block;color:var(--parch-dim);letter-spacing:3px}
.sep{width:1px;height:26px;background:var(--border);flex-shrink:0}
.res{display:flex;align-items:center;gap:.22rem;background:rgba(200,150,12,.06);border:1px solid var(--border);border-radius:3px;padding:.18rem .45rem;font-size:.78rem}
.res .v{color:var(--parch-light);font-weight:600;min-width:24px}
.res.rare .v{color:var(--gold-light)}
.moral-chip{display:flex;align-items:center;gap:.4rem;background:rgba(200,150,12,.06);border:1px solid var(--border);border-radius:3px;padding:.18rem .6rem;font-size:.78rem;margin-left:auto}
.moral-bar-bg{width:60px;height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}
.moral-bar{height:100%;border-radius:3px;transition:width .5s,background .5s}
#main{position:relative;z-index:10;display:flex;height:calc(100vh - 46px);overflow:hidden}
#left-panel{width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lp-tabs{display:flex;border-bottom:1px solid var(--border)}
.lp-tab{flex:1;padding:.45rem .2rem;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--parch-dim);cursor:pointer;text-align:center;border-bottom:2px solid transparent;transition:all .2s}
.lp-tab:hover{color:var(--parch)}.lp-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.lp-body{flex:1;overflow-y:auto;padding:.5rem}
.lp-body::-webkit-scrollbar{width:3px}.lp-body::-webkit-scrollbar-thumb{background:var(--border)}
.troop-row{display:flex;align-items:center;gap:.45rem;padding:.4rem .5rem;border-radius:3px;cursor:pointer;border:1px solid transparent;margin-bottom:.22rem;transition:all .15s}
.troop-row:hover{background:rgba(200,150,12,.06);border-color:var(--border)}
.tr-icon{font-size:1.1rem;flex-shrink:0}.tr-name{flex:1;font-size:.78rem}
.tr-count{font-size:.72rem;background:rgba(200,150,12,.1);border:1px solid rgba(200,150,12,.25);border-radius:8px;padding:1px 5px;color:var(--gold);flex-shrink:0}
#center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.center-tabs{display:flex;background:rgba(8,5,1,.9);border-bottom:1px solid var(--border)}
.c-tab{padding:.5rem 1.2rem;font-family:'Uncial Antiqua',serif;font-size:.75rem;letter-spacing:1.5px;color:var(--parch-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.c-tab:hover{color:var(--parch)}.c-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.c-content{flex:1;overflow-y:auto;padding:1rem 1.2rem}
.c-content::-webkit-scrollbar{width:4px}.c-content::-webkit-scrollbar-thumb{background:var(--border)}
.c-pane{display:none}.c-pane.active{display:block}
.recruit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.9rem;margin-bottom:1.5rem}
.recruit-card{background:rgba(14,10,4,.9);border:1px solid var(--border);border-radius:5px;padding:.9rem;position:relative;transition:border-color .2s,transform .2s;overflow:hidden}
.recruit-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .2s}
.recruit-card:hover{border-color:var(--gold);transform:translateY(-2px)}.recruit-card:hover::before{opacity:1}
.recruit-card.locked{opacity:.4}
.rc-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.rc-icon{font-size:2rem}.rc-name{font-family:'Uncial Antiqua',serif;font-size:.88rem;color:var(--gold-light);letter-spacing:1px}
.rc-role{font-size:.65rem;color:var(--parch-dim);font-style:italic}
.rc-stats{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
.stat-pill{display:flex;align-items:center;gap:.2rem;background:rgba(200,150,12,.06);border:1px solid rgba(200,150,12,.15);border-radius:3px;padding:.15rem .4rem;font-size:.72rem}
.rc-count{text-align:center;font-size:1.5rem;font-weight:600;color:var(--parch-light);margin-bottom:.4rem}
.rc-cost{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem}
.cost-pill{display:flex;align-items:center;gap:.2rem;font-size:.72rem;padding:.15rem .35rem;border-radius:3px;border:1px solid rgba(200,150,12,.2)}
.cost-pill.ok{color:var(--parch)}.cost-pill.nok{color:var(--blood-bright);border-color:rgba(231,76,60,.3)}
.rc-train-row{display:flex;gap:.4rem;align-items:center}
.rc-input{width:55px;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--parch);padding:.28rem .4rem;font-family:'IM Fell English',serif;font-size:.95rem;border-radius:3px;text-align:center;outline:none}
.rc-input:focus{border-color:var(--gold)}
.btn-train{flex:1;padding:.35rem .5rem;font-family:'Uncial Antiqua',serif;font-size:.7rem;letter-spacing:1px;background:rgba(200,150,12,.1);border:1px solid rgba(200,150,12,.4);color:var(--gold);cursor:pointer;border-radius:3px;transition:all .2s}
.btn-train:hover:not(:disabled){background:rgba(200,150,12,.22)}.btn-train:disabled{opacity:.35;cursor:not-allowed}
.train-queue{background:rgba(200,150,12,.06);border:1px solid var(--border);border-radius:4px;padding:.7rem 1rem;margin-bottom:1rem}
.tq-title{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--parch-dim);margin-bottom:.5rem}
.tq-item{display:flex;align-items:center;gap:.5rem;font-size:.82rem;margin-bottom:.3rem}
.tq-bar-bg{flex:1;background:rgba(0,0,0,.4);border-radius:3px;height:5px;overflow:hidden}
.tq-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:3px;transition:width 1s}
.hero-avatar-wrap{border-radius:50%;border:3px solid var(--gold);background:radial-gradient(ellipse,rgba(200,150,12,.15),rgba(14,10,4,.95));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--gold-glow);animation:heroGlow 3s ease-in-out infinite;overflow:hidden}
@keyframes heroGlow{0%,100%{box-shadow:0 0 15px var(--gold-glow)}50%{box-shadow:0 0 30px var(--gold-glow)}}
.hero-xp-bg{background:rgba(0,0,0,.4);border-radius:3px;height:7px;overflow:hidden}
.hero-xp-fill{height:100%;background:linear-gradient(90deg,#8e44ad,#c070e0);border-radius:3px;transition:width .8s ease}
.hero-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:1rem}
.hs-item{background:rgba(200,150,12,.05);border:1px solid var(--border);border-radius:3px;padding:.35rem .5rem;text-align:center}
.hs-label{font-size:.6rem;color:var(--parch-dim);letter-spacing:1px;text-transform:uppercase}
.hs-val{font-size:.95rem;color:var(--parch-light);font-weight:600}
.talent-tree{display:flex;flex-direction:column;gap:.3rem}
.talent-path-label{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--parch-dim);margin:.6rem 0 .3rem;padding-bottom:.2rem;border-bottom:1px solid rgba(200,150,12,.1)}
.talent-node{display:flex;align-items:center;gap:.6rem;padding:.45rem .7rem;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:rgba(200,150,12,.03);transition:all .2s}
.talent-node:hover:not(.locked-t){border-color:var(--gold);background:rgba(200,150,12,.09)}
.talent-node.learned{border-color:var(--moss-light);background:rgba(74,122,53,.1)}
.talent-node.available{border-color:rgba(200,150,12,.5);background:rgba(200,150,12,.07)}
.talent-node.locked-t{opacity:.38;cursor:default}
.t-icon{font-size:1.2rem;flex-shrink:0}.t-body{flex:1}
.t-name{font-size:.82rem;color:var(--parch-light);margin-bottom:.1rem}
.t-desc{font-size:.7rem;color:var(--parch-dim);font-style:italic}
.t-badge{font-size:.62rem;padding:2px 6px;border-radius:10px;flex-shrink:0}
.t-badge.done{background:rgba(74,122,53,.3);color:var(--moss-light)}.t-badge.avail{background:rgba(200,150,12,.2);color:var(--gold)}.t-badge.lock{background:rgba(0,0,0,.3);color:var(--parch-dim)}
.tp-display{display:flex;align-items:center;gap:.5rem;background:rgba(142,68,173,.08);border:1px solid rgba(142,68,173,.3);border-radius:3px;padding:.35rem .8rem;margin-bottom:.8rem;font-size:.82rem}
.tp-val{color:#c070e0;font-size:1.1rem;font-weight:600}
.combat-setup{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:start;margin-bottom:1rem}
.side-card{background:rgba(14,10,4,.9);border:1px solid var(--border);border-radius:5px;padding:.9rem}
.side-title{font-family:'Uncial Antiqua',serif;font-size:.9rem;letter-spacing:1px;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.side-title.ally{color:var(--moss-light)}.side-title.enemy{color:var(--blood-bright)}
.vs-divider{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding-top:2rem}
.vs-text{font-family:'Uncial Antiqua',serif;font-size:1.4rem;color:var(--gold);text-shadow:0 0 15px var(--gold-glow)}
.troop-deploy{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem;font-size:.82rem}
.deploy-input{width:55px;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--parch);padding:.22rem .4rem;font-family:'IM Fell English',serif;font-size:.9rem;border-radius:3px;text-align:center;outline:none}
.deploy-input:focus{border-color:var(--gold)}
.deploy-max{font-size:.65rem;color:var(--parch-dim)}
.enemy-select{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--parch);padding:.5rem;font-family:'IM Fell English',serif;font-size:.88rem;border-radius:3px;outline:none;margin-bottom:.6rem}
.enemy-stat-row{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.25rem}
.enemy-stat-row span:first-child{color:var(--parch-dim)}.enemy-stat-row span:last-child{color:var(--parch-light);font-weight:600}
.enemy-preview{display:flex;justify-content:center;margin-bottom:.6rem}
.btn-fight{width:100%;padding:.65rem;font-family:'Uncial Antiqua',serif;font-size:.9rem;letter-spacing:2px;background:linear-gradient(135deg,rgba(139,26,26,.3),rgba(200,50,50,.15));border:1px solid rgba(231,76,60,.6);color:#e74c3c;cursor:pointer;border-radius:4px;transition:all .2s;margin-top:.5rem}
.btn-fight:hover:not(:disabled){background:rgba(139,26,26,.4);box-shadow:0 0 15px rgba(231,76,60,.3)}
.btn-fight:disabled{opacity:.35;cursor:not-allowed}

/* ARÈNE */
#battle-arena{display:none;position:fixed;inset:0;z-index:500;background:#050210;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#battle-arena.open{display:flex}
.arena-sky{position:absolute;top:0;left:0;right:0;height:60%;background:linear-gradient(180deg,#050210 0%,#0d0525 40%,#1a0820 100%)}
.arena-ground{position:absolute;bottom:0;left:0;right:0;height:42%;background:linear-gradient(180deg,transparent,rgba(20,8,5,.9),#0a0403)}
.arena-ground-line{position:absolute;bottom:38%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(200,150,12,.3),rgba(200,150,12,.5),rgba(200,150,12,.3),transparent)}
.torch{position:absolute;bottom:38%;font-size:2rem;filter:drop-shadow(0 0 12px #ff8c00);animation:torchFlicker .3s ease-in-out infinite alternate}
@keyframes torchFlicker{0%{filter:drop-shadow(0 0 8px #ff8c00) brightness(.9)}100%{filter:drop-shadow(0 0 20px #ffa500) brightness(1.1)}}
.a-star{position:absolute;background:white;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.arena-title-wrap{position:relative;z-index:10;text-align:center;margin-bottom:1rem}
.arena-title{font-family:'Uncial Antiqua',serif;font-size:1.5rem;color:var(--gold);letter-spacing:4px;text-shadow:0 0 30px var(--gold-glow)}
.arena-round{font-size:.72rem;color:var(--parch-dim);letter-spacing:3px;margin-top:.2rem}
.fighters-row{display:flex;align-items:flex-end;gap:2.5rem;position:relative;z-index:10;margin-bottom:1rem}
.fighter{display:flex;flex-direction:column;align-items:center;gap:.4rem;position:relative}
.fighter-sprite-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:80px}
.fighter-sprite-wrap svg{filter:drop-shadow(0 6px 16px rgba(0,0,0,.9))}
.fighter.ally   .fighter-sprite-wrap svg{animation:idleA 2s ease-in-out infinite}
.fighter.enemy  .fighter-sprite-wrap svg{animation:idleE 2s ease-in-out infinite;transform:scaleX(-1)}
@keyframes idleA{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes idleE{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-5px)}}
.fighter.attacking       .fighter-sprite-wrap svg{animation:atkA  .45s ease-out forwards!important}
.fighter.enemy.attacking .fighter-sprite-wrap svg{animation:atkE  .45s ease-out forwards!important}
.fighter.hit             .fighter-sprite-wrap svg{animation:hitA  .35s ease-out!important}
.fighter.enemy.hit       .fighter-sprite-wrap svg{animation:hitE  .35s ease-out!important}
.fighter.dead            .fighter-sprite-wrap svg{animation:dieA  .6s ease-out forwards!important}
.fighter.enemy.dead      .fighter-sprite-wrap svg{animation:dieE  .6s ease-out forwards!important}
@keyframes atkA{0%{transform:translateX(0)}35%{transform:translateX(55px)}65%{transform:translateX(-8px)}100%{transform:translateX(0)}}
@keyframes atkE{0%{transform:scaleX(-1)}35%{transform:scaleX(-1) translateX(55px)}65%{transform:scaleX(-1) translateX(-8px)}100%{transform:scaleX(-1)}}
@keyframes hitA{0%,100%{transform:translateX(0)}30%{transform:translateX(-14px)}70%{transform:translateX(5px)}}
@keyframes hitE{0%,100%{transform:scaleX(-1)}30%{transform:scaleX(-1) translateX(-14px)}70%{transform:scaleX(-1) translateX(5px)}}
@keyframes dieA{to{transform:rotate(-85deg) translateX(-35px);opacity:.25}}
@keyframes dieE{to{transform:scaleX(-1) rotate(85deg) translateX(-35px);opacity:.25}}
.fighter.ally  .fighter-sprite-wrap::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(200,150,12,.2),transparent);filter:blur(4px)}
.fighter.enemy .fighter-sprite-wrap::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(200,50,50,.18),transparent);filter:blur(4px)}
.fighter-name{font-family:'Uncial Antiqua',serif;font-size:.78rem;color:var(--gold-light);letter-spacing:1px;white-space:nowrap}
.fighter-hp-wrap{display:flex;flex-direction:column;align-items:center;gap:.18rem;width:120px}
.fighter-hp-label{display:flex;justify-content:space-between;width:100%;font-size:.65rem;color:var(--parch-dim)}
.fighter-hp-bg{width:100%;height:9px;background:rgba(0,0,0,.7);border-radius:5px;overflow:hidden;border:1px solid rgba(200,150,12,.2)}
.fighter-hp-bar{height:100%;border-radius:5px;transition:width .4s ease,background .4s}
.dmg-float{position:fixed;font-family:'Uncial Antiqua',serif;font-weight:700;pointer-events:none;animation:dmgF 1.3s ease-out forwards;z-index:600}
@keyframes dmgF{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-65px) scale(1.5)}}
.battle-log{width:min(500px,90vw);max-height:110px;overflow-y:auto;background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:4px;padding:.4rem .8rem;position:relative;z-index:10;margin-bottom:.8rem}
.battle-log::-webkit-scrollbar{width:3px}.battle-log::-webkit-scrollbar-thumb{background:var(--border)}
.blog-line{font-size:.73rem;line-height:1.7;border-bottom:1px solid rgba(200,150,12,.04)}
.blog-line.ally-line{color:var(--moss-light)}.blog-line.enemy-line{color:var(--blood-bright)}.blog-line.event-line{color:var(--gold)}
.battle-btns{display:flex;gap:.8rem;position:relative;z-index:10}
.btn-arena{padding:.45rem 1.3rem;font-family:'Uncial Antiqua',serif;font-size:.78rem;letter-spacing:1.5px;border-radius:3px;cursor:pointer;transition:all .2s}
.btn-skip{background:rgba(200,150,12,.1);border:1px solid rgba(200,150,12,.4);color:var(--gold)}
.btn-skip:hover{background:rgba(200,150,12,.22)}
.btn-close-arena{background:rgba(139,26,26,.2);border:1px solid rgba(231,76,60,.4);color:var(--blood-bright)}
.btn-close-arena:hover{background:rgba(139,26,26,.35)}
.battle-result{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);animation:resIn .5s ease}
@keyframes resIn{from{opacity:0}to{opacity:1}}
.result-card{background:rgba(10,5,2,.98);border:2px solid var(--gold);border-radius:8px;padding:2rem 3rem;text-align:center;box-shadow:0 0 60px var(--gold-glow)}
.result-title{font-family:'Uncial Antiqua',serif;font-size:2rem;letter-spacing:4px;margin-bottom:.5rem}
.result-title.victory{color:var(--gold-light);text-shadow:0 0 30px var(--gold-glow)}
.result-title.defeat{color:var(--blood-bright);text-shadow:0 0 30px rgba(231,76,60,.5)}
.result-sub{font-size:.9rem;color:var(--parch-dim);font-style:italic;margin-bottom:1.2rem}
.result-rewards{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.2rem}
.reward-chip{background:rgba(200,150,12,.1);border:1px solid rgba(200,150,12,.3);border-radius:3px;padding:.3rem .7rem;font-size:.82rem;color:var(--gold-light)}
.report-card{background:rgba(14,10,4,.9);border:1px solid var(--border);border-radius:5px;padding:1rem 1.2rem;margin-bottom:.8rem;border-left:3px solid var(--parch-dim)}
.report-card.victory{border-left-color:var(--moss-light)}.report-card.defeat{border-left-color:var(--blood-bright)}
.rc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.rc-title{font-family:'Uncial Antiqua',serif;font-size:.9rem}
.rc-title.victory{color:var(--moss-light)}.rc-title.defeat{color:var(--blood-bright)}
.rc-time{font-size:.7rem;color:var(--parch-dim)}
.rc-body{font-size:.82rem;color:var(--parch-dim);line-height:1.6;font-style:italic}
.rc-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.gain-chip{font-size:.72rem;background:rgba(74,122,53,.1);border:1px solid rgba(74,122,53,.3);border-radius:3px;padding:.15rem .45rem;color:var(--moss-light)}
.loss-chip{font-size:.72rem;background:rgba(139,26,26,.1);border:1px solid rgba(139,26,26,.3);border-radius:3px;padding:.15rem .45rem;color:var(--blood-bright)}
.sec-t{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--parch-dim);margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px solid rgba(200,150,12,.1)}
#toasts{position:fixed;bottom:1.2rem;right:1.2rem;z-index:9999;display:flex;flex-direction:column;gap:.4rem;pointer-events:none}
.toast{background:rgba(8,5,1,.97);border:1px solid var(--gold);border-radius:3px;padding:.45rem .9rem;font-size:.82rem;color:var(--parch-light);box-shadow:0 4px 20px rgba(0,0,0,.7);animation:tIn .3s cubic-bezier(.34,1.56,.64,1),tOut .3s ease 3.5s forwards;display:flex;align-items:center;gap:.4rem;max-width:270px;pointer-events:none}
.toast.s{border-color:var(--moss-light)}.toast.d{border-color:var(--blood-bright)}
@keyframes tIn{from{opacity:0;transform:translateX(30px)}}
@keyframes tOut{to{opacity:0;transform:translateX(30px)}}
@media(max-width:700px){#left-panel{display:none}.combat-setup{grid-template-columns:1fr}.vs-divider{flex-direction:row;padding:0;margin:.5rem 0}}
</style>

<body>
<div id="bg"><div class="bg-rune" style="top:8%;left:4%">ᚦ</div><div class="bg-rune" style="top:55%;left:82%;animation-delay:-9s">ᛏ</div></div>
<div id="topbar">
  <a class="logo" href="yggdrasil-village.html">YGGDRASIL<span>⁂ armée ⁂</span></a>
  <div class="sep"></div>
  <div style="display:flex;gap:.35rem;flex-wrap:wrap">
    <div class="res"><span>🪵</span><span class="v" id="r-wood">480</span></div>
    <div class="res"><span>🪨</span><span class="v" id="r-stone">320</span></div>
    <div class="res"><span>🌾</span><span class="v" id="r-food">610</span></div>
    <div class="res"><span>🪙</span><span class="v" id="r-gold">145</span></div>
    <div class="res rare"><span>ᚱ</span><span class="v" id="r-runes">12</span></div>
    <div class="res rare"><span>🍺</span><span class="v" id="r-mead">28</span></div>

  <div class="moral-chip">
    <span>⚔ Moral</span>
    <div class="moral-bar-bg"><div class="moral-bar" id="moral-bar" style="width:75%;background:#6aaa50"></div></div>
    <span id="moral-val" style="color:#6aaa50;font-weight:600">75</span>
  </div>
</div>
<div id="main">
  <div id="left-panel">
    <div class="lp-tabs">
      <div class="lp-tab active" onclick="lpTab('troops',this)">Troupes</div>
      <div class="lp-tab" onclick="lpTab('hero',this)">Héros</div>
    </div>
    <div class="lp-body" id="lp-troops"></div>
    <div class="lp-body" id="lp-hero" style="display:none"></div>
  </div>
  <div id="center">
    <div class="center-tabs">
      <div class="c-tab active" onclick="cTab('recruit',this)">⚔ Recrutement</div>
      <div class="c-tab" onclick="cTab('hero',this)">🦸 Héros</div>
      <div class="c-tab" onclick="cTab('combat',this)">💀 Combat</div>
      <div class="c-tab" onclick="cTab('reports',this)">📜 Rapports</div>
    </div>
    <div class="c-content">
      <div class="c-pane active" id="pane-recruit"><div id="train-queue-wrap"></div><div class="recruit-grid" id="recruit-grid"></div></div>
      <div class="c-pane" id="pane-hero"><div id="hero-panel"></div></div>
      <div class="c-pane" id="pane-combat"><div id="combat-panel"></div></div>
      <div class="c-pane" id="pane-reports"><div class="sec-t">Journal de Guerre</div><div id="reports-list"></div></div>
    </div>
  </div>
</div>
<div id="battle-arena">
  <div class="arena-sky" id="arena-sky"></div>
  <div class="arena-ground"></div>
  <div class="arena-ground-line"></div>
  <div class="torch" style="left:8%">🔥</div>
  <div class="torch" style="left:18%;animation-delay:.15s">🔥</div>
  <div class="torch" style="right:8%">🔥</div>
  <div class="torch" style="right:18%;animation-delay:.2s">🔥</div>

    <div class="arena-title" id="arena-title">⚔ BATAILLE ⚔</div>
    <div class="arena-round" id="arena-round">Round 0</div>
  </div>
  <div class="fighters-row" id="fighters-row">
    <div class="fighter ally" id="fighter-ally">
      <div class="fighter-sprite-wrap" id="sprite-ally-wrap"></div>
      <div class="fighter-name" id="fname-ally">Ragnar</div>

        <div class="fighter-hp-label"><span>HP</span><span id="hp-ally-txt">100</span></div>

    </div>
    <div style="font-family:'Uncial Antiqua',serif;font-size:2.5rem;color:var(--gold);position:relative;z-index:10;text-shadow:0 0 20px var(--gold-glow)">⚔</div>

      <div class="fighter-sprite-wrap" id="sprite-enemy-wrap"></div>
      <div class="fighter-name" id="fname-enemy">Ennemi</div>

        <div class="fighter-hp-bg"><div class="fighter-hp-bar" id="hp-enemy" style="width:100%;background:#e74c3c"></div></div>
      </div>
    </div>
  </div>
  <div class="battle-log" id="battle-log"></div>
  <div class="battle-btns">
    <button class="btn-arena btn-skip" id="btn-skip" onclick="skipBattle()">⏩ Passer</button>
    <button class="btn-arena btn-close-arena" id="btn-close-arena" style="display:none" onclick="closeBattleArena()">✕ Fermer</button>
  </div>
</div>

function init(){renderTroopList();renderHeroSidebar();renderRecruitGrid();renderHeroPanel();renderCombatPanel();renderReports();updateRes();updateMoral();spawnArenaStars()}
function lpTab(tab,el){
  document.getElementById('lp-troops').style.display=tab==='troops'?'':'none';
  document.getElementById('lp-hero').style.display=tab==='hero'?'':'none';
  document.querySelectorAll('.lp-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  if(tab==='hero')renderHeroSidebar();
}
function cTab(tab,el){
  document.querySelectorAll('.c-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  document.querySelectorAll('.c-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  if(tab==='reports')renderReports();
}
function isUnlocked(t){return(state.buildings[t.unlock]||0)>=t.unlockLvl}

function renderTroopList(){
  let html='<div class="sec-t" style="margin-top:.3rem">Vos effectifs</div>',tot=0;
  TROOPS_DEF.forEach(t=>{const n=state.troops[t.id]||0;if(!isUnlocked(t))return;tot+=n;
    html+=`<div class="troop-row"><div class="tr-icon">${t.icon}</div><div class="tr-name">${t.name}</div><div class="tr-count">${n}</div></div>`;});
  html+=`<div style="margin-top:.5rem;font-size:.72rem;color:var(--parch-dim);text-align:center">Total : ${tot}</div>`;
  document.getElementById('lp-troops').innerHTML=html;
}

function renderRecruitGrid(){
  const g=document.getElementById('recruit-grid');g.innerHTML='';
  TROOPS_DEF.forEach(t=>{
    const u=isUnlocked(t),n=state.troops[t.id]||0;
    const card=document.createElement('div');card.className='recruit-card'+(u?'':' locked');
    const cH=Object.entries(t.cost).filter(([,v])=>v>0).map(([r,v])=>{
      const ic={wood:'🪵',stone:'🪨',food:'🌾',gold:'🪙'};
      return`<div class="cost-pill ${(state.resources[r]||0)>=v?'ok':'nok'}">${ic[r]} ${v}</div>`;}).join('');
    card.innerHTML=`<div class="rc-top"><div class="rc-icon">${u?t.icon:'🔒'}</div>
      <div><div class="rc-name">${t.name}</div><div class="rc-role">${u?'Unité de combat':'Caserne Niv.'+t.unlockLvl+' requis'}</div></div></div>
      ${u?`<div class="rc-stats"><div class="stat-pill">⚔${t.atk}</div><div class="stat-pill">🛡${t.def}</div><div class="stat-pill">❤${t.hp}</div><div class="stat-pill">🌾${t.food}/t</div></div>
      <div class="rc-count">${n}</div><div class="rc-cost">${cH}</div>
      <div class="rc-train-row"><input class="rc-input" type="number" id="qty-${t.id}" min="1" value="1">
      <button class="btn-train" onclick="trainTroop('${t.id}')">Entraîner</button></div>`:'<p style="font-size:.75rem;color:var(--parch-dim);font-style:italic;margin-top:.3rem">Déblocage requis</p>'}`;
    g.appendChild(card);});
  renderTrainQueue();
}
function trainTroop(id){
  const t=TROOPS_DEF.find(x=>x.id===id);
  const q=parseInt(document.getElementById('qty-'+id)?.value)||1;
  const tc={};Object.entries(t.cost).forEach(([r,v])=>{tc[r]=(tc[r]||0)+v*q});
  if(!Object.entries(tc).every(([r,v])=>(state.resources[r]||0)>=v)){toast('❌ Ressources insuffisantes','d');return}
  Object.entries(tc).forEach(([r,v])=>{state.resources[r]-=v});
  state.trainQueue.push({id,name:t.name,icon:t.icon,qty:q,ticksLeft:t.trainTime*q,total:t.trainTime*q});
  updateRes();renderRecruitGrid();toast(`⚔ ${q}× ${t.name} en entraînement !`,'s');
}
function renderTrainQueue(){
  const w=document.getElementById('train-queue-wrap');if(!state.trainQueue.length){w.innerHTML='';return}
  let h='<div class="train-queue"><div class="tq-title">🔨 File d\'entraînement</div>';
  state.trainQueue.forEach(q=>{const p=((q.total-q.ticksLeft)/q.total*100).toFixed(0);
    h+=`<div class="tq-item"><span>${q.icon}</span><span style="font-size:.8rem;min-width:90px">${q.qty}× ${q.name}</span>
      <div class="tq-bar-bg"><div class="tq-bar" style="width:${p}%"></div></div>
      <span style="font-size:.7rem;color:var(--parch-dim)">${q.ticksLeft}t</span></div>`;});
  w.innerHTML=h+'</div>';
}

function renderHeroSidebar(){
  const h=state.hero,s=SP[state.role]||SP.jarl;
  document.getElementById('lp-hero').innerHTML=`
    <div style="display:flex;justify-content:center;margin:.5rem 0">
      <div class="hero-avatar-wrap" style="width:80px;height:90px">${s}</div></div>
    <div style="font-family:'Uncial Antiqua',serif;color:var(--gold-light);font-size:.85rem;text-align:center">${h.name}</div>
    <div style="font-size:.7rem;color:var(--parch-dim);margin-bottom:.5rem;text-align:center">Niv. ${h.level} · ${ROLES_NAMES[state.role]}</div>
    <div class="hero-xp-bg" style="margin-bottom:.4rem"><div class="hero-xp-fill" style="width:${h.xp/h.xpNext*100}%"></div></div>
    <div style="font-size:.65rem;color:var(--parch-dim);text-align:center;margin-bottom:.6rem">${h.xp}/${h.xpNext} XP</div>
    <div class="sec-t">Stats</div>
    ${[['⚔ Att.',h.atk],['🛡 Déf.',h.def],['❤ HP',h.hp],['✦ Pts',h.talentPoints,'#c070e0']].map(([l,v,c])=>
      `<div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.2rem">
        <span style="color:var(--parch-dim)">${l}</span><span style="color:${c||'var(--parch)'}">${v}</span></div>`).join('')}`;
}
function renderHeroPanel(){
  const h=state.hero,s=SP[state.role]||SP.jarl,paths=HERO_TALENTS[state.role]||[];
  let tH='';
  paths.forEach(p=>{
    tH+=`<div class="talent-path-label">⚔ ${p.path}</div>`;
    p.nodes.forEach(n=>{
      const L=h.learned.has(n.id),R=!n.requires||h.learned.has(n.requires),C=!L&&R&&h.talentPoints>=n.cost;
      const cls=L?'learned':R?'available':'locked-t';
      const badge=L?`<span class="t-badge done">Appris</span>`:R?`<span class="t-badge avail">${n.cost}pt</span>`:`<span class="t-badge lock">🔒</span>`;
      tH+=`<div class="talent-node ${cls}" onclick="${C?`learnTalent('${n.id}')`:''}" >
        <span class="t-icon">${n.icon}</span><div class="t-body"><div class="t-name">${n.name}</div><div class="t-desc">${n.desc}</div></div>${badge}</div>`;});});
  document.getElementById('hero-panel').innerHTML=`
    <div style="display:flex;gap:1.2rem;margin-bottom:1.2rem;align-items:flex-start;flex-wrap:wrap">
      <div class="hero-avatar-wrap" style="width:90px;height:100px">${s}</div>
      <div style="flex:1">
        <div style="font-family:'Uncial Antiqua',serif;font-size:1.2rem;color:var(--gold-light);margin-bottom:.2rem">${h.name}</div>
        <div style="font-size:.8rem;color:var(--parch-dim);font-style:italic;margin-bottom:.5rem">Niveau ${h.level} · ${ROLES_NAMES[state.role]}</div>
        <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--parch-dim);margin-bottom:.25rem"><span>Expérience</span><span>${h.xp}/${h.xpNext}</span></div>
        <div class="hero-xp-bg"><div class="hero-xp-fill" style="width:${h.xp/h.xpNext*100}%"></div></div></div></div>
    <div class="hero-stats-grid">
      ${[['Attaque','⚔ '+h.atk],['Défense','🛡 '+h.def],['HP','❤ '+h.hp],['Vitesse','⚡ '+h.level],['Victoires','🏆 '+state.reports.filter(r=>r.type==='victory').length],['Moral',state.moral+'%']].map(([l,v])=>
        `<div class="hs-item"><div class="hs-label">${l}</div><div class="hs-val">${v}</div></div>`).join('')}
    </div>
    <div class="tp-display"><span>✦ Points de talent :</span><span class="tp-val">${h.talentPoints}</span></div>
    <div class="talent-tree">${tH}</div>`;
}
function learnTalent(id){
  const h=state.hero;let node=null;
  for(const ps of Object.values(HERO_TALENTS)){for(const p of ps){node=p.nodes.find(n=>n.id===id);if(node)break}if(node)break}
  if(!node||h.learned.has(id)||h.talentPoints<node.cost)return;
  h.learned.add(id);h.talentPoints-=node.cost;
  toast(`✦ Talent appris : ${node.name} !`,'s');renderHeroPanel();renderHeroSidebar();
}

function renderCombatPanel(){
  const tot=Object.values(state.troops).reduce((s,v)=>s+v,0);
  const tI=TROOPS_DEF.filter(t=>isUnlocked(t)&&(state.troops[t.id]||0)>0).map(t=>`
    <div class="troop-deploy"><span style="font-size:1rem">${t.icon}</span>
      <span style="flex:1;font-size:.8rem">${t.name}</span><span class="deploy-max">(${state.troops[t.id]||0})</span>
      <input class="deploy-input" type="number" id="deploy-${t.id}" min="0" max="${state.troops[t.id]||0}" value="${Math.floor((state.troops[t.id]||0)/2)}"></div>`).join('');
  const eO=ENEMIES.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('combat-panel').innerHTML=`
    <div class="combat-setup">
      <div class="side-card"><div class="side-title ally">🪓 Vos forces</div>
        <div style="font-size:.75rem;color:var(--parch-dim);margin-bottom:.6rem;font-style:italic">Héros : ${state.hero.name} (ATK ${state.hero.atk}, HP ${state.hero.hp})</div>
        ${tI||'<p style="color:var(--parch-dim);font-size:.8rem;font-style:italic">Entraînez des troupes !</p>'}</div>
      <div class="vs-divider"><div class="vs-text">VS</div><div style="font-size:1.5rem">⚔</div></div>
      <div class="side-card"><div class="side-title enemy">💀 Ennemi</div>
        <select class="enemy-select" id="enemy-select" onchange="updateEnemyInfo()">${eO}</select>
        <div class="enemy-preview" id="enemy-preview"></div>
        <div id="enemy-info-block"></div></div>
    </div>
    <button class="btn-fight" onclick="startBattle()" ${tot===0?'disabled':''}>⚔ LANCER LA BATAILLE ⚔</button>`;
  updateEnemyInfo();
}
function updateEnemyInfo(){
  const sel=document.getElementById('enemy-select');if(!sel)return;
  const e=ENEMIES.find(x=>x.id===sel.value)||ENEMIES[0];
  const prev=document.getElementById('enemy-preview');
  if(prev)prev.innerHTML=SP[e.sprite]||'';
  document.getElementById('enemy-info-block').innerHTML=`
    <div class="enemy-stat-row"><span>⚔ Attaque</span><span>${e.atk}</span></div>
    <div class="enemy-stat-row"><span>🛡 Défense</span><span>${e.def}</span></div>
    <div class="enemy-stat-row"><span>❤ HP</span><span>${e.hp}</span></div>
    <div class="enemy-stat-row"><span>🏆 Gloire</span><span>+${e.glory}</span></div>
    <div class="enemy-stat-row"><span>💰 Butin</span><span>${Object.entries(e.reward).map(([r,v])=>v+' '+(RES_ICONS[r]||r)).join(' ')}</span></div>`;
}

let battleData=null,battleInterval=null;
function startBattle(){
  const sel=document.getElementById('enemy-select');
  const enemy=ENEMIES.find(x=>x.id===sel?.value)||ENEMIES[0];
  let aAtk=state.hero.atk,aDef=state.hero.def,aHp=state.hero.hp;
  TROOPS_DEF.forEach(t=>{const n=parseInt(document.getElementById('deploy-'+t.id)?.value)||0;aAtk+=n*t.atk;aDef+=n*t.def;aHp+=n*t.hp;});
  aAtk=Math.floor(aAtk*(.7+(state.moral/100)*.6));
  battleData={aHp,aMaxHp:aHp,aAtk,aDef,eHp:enemy.hp,eMaxHp:enemy.hp,eAtk:enemy.atk,eDef:enemy.def,enemy,round:0,done:false};
  document.getElementById('sprite-ally-wrap').innerHTML=SP[state.role]||SP.jarl;
  document.getElementById('sprite-enemy-wrap').innerHTML=SP[enemy.sprite]||SP.draugr;
  document.getElementById('fname-ally').textContent=state.hero.name;
  document.getElementById('fname-enemy').textContent=enemy.name;
  ['hp-ally','hp-enemy'].forEach(id=>{const b=document.getElementById(id);if(b){b.style.width='100%';b.style.background=id.includes('ally')?'#6aaa50':'#e74c3c'}});
  document.getElementById('hp-ally-txt').textContent=aHp;
  document.getElementById('hp-enemy-txt').textContent=enemy.hp;
  document.getElementById('battle-log').innerHTML='';
  document.getElementById('arena-title').textContent='⚔ '+enemy.name+' ⚔';
  document.getElementById('arena-round').textContent='Round 0';
  document.getElementById('btn-close-arena').style.display='none';
  document.getElementById('btn-skip').style.display='';
  document.querySelector('.battle-result')?.remove();
  document.getElementById('battle-arena').classList.add('open');
  battleInterval=setInterval(battleTick,950);
}
function battleTick(){
  if(!battleData||battleData.done)return;
  battleData.round++;
  document.getElementById('arena-round').textContent=`Round ${battleData.round}`;
  const bd=battleData;
  const ad=Math.max(1,Math.floor(bd.aAtk-bd.eDef/2+(Math.random()*8-4)));
  bd.eHp=Math.max(0,bd.eHp-ad);
  addBattleLog(`${state.hero.name} attaque : -${ad} HP`,'ally-line');
  animF('fighter-ally','attacking');setTimeout(()=>animF('fighter-enemy','hit'),200);
  showDmg('fighter-enemy',ad,'#6aaa50');
  setTimeout(()=>{
    if(!battleData||bd.eHp<=0)return;
    const ed=Math.max(1,Math.floor(bd.eAtk-bd.aDef/2+(Math.random()*8-4)));
    bd.aHp=Math.max(0,bd.aHp-ed);
    addBattleLog(`${bd.enemy.name} riposte : -${ed} HP`,'enemy-line');
    animF('fighter-enemy','attacking');setTimeout(()=>animF('fighter-ally','hit'),200);
    showDmg('fighter-ally',ed,'#e74c3c');
    updateHpBars();checkBattleEnd();
  },480);
  if(bd.round===2&&state.hero.learned.has('j1'))addBattleLog('✦ Lame Affûtée activée !','event-line');
  if(bd.round===2&&state.hero.learned.has('c1'))addBattleLog('🔥 Rune de Feu !','event-line');
  if(bd.round===3&&state.hero.learned.has('c4')){bd.aHp=Math.min(bd.aMaxHp,bd.aHp+Math.floor(bd.aMaxHp*.15));addBattleLog('🌿 Herbes Sacrées — soins !','ally-line')}
  updateHpBars();
}
function updateHpBars(){
  const bd=battleData;if(!bd)return;
  const ap=Math.max(0,bd.aHp/bd.aMaxHp*100),ep=Math.max(0,bd.eHp/bd.eMaxHp*100);
  const col=p=>p>=60?'#6aaa50':p>=30?'#d4a017':'#e74c3c';
  const ha=document.getElementById('hp-ally'),he=document.getElementById('hp-enemy');
  if(ha){ha.style.width=ap+'%';ha.style.background=col(ap)}
  if(he){he.style.width=ep+'%';he.style.background=col(ep)}
  document.getElementById('hp-ally-txt').textContent=Math.max(0,Math.floor(bd.aHp));
  document.getElementById('hp-enemy-txt').textContent=Math.max(0,Math.floor(bd.eHp));
}
function checkBattleEnd(){
  const bd=battleData;if(!bd||bd.done)return;
  if(bd.aHp<=0||bd.eHp<=0){bd.done=true;clearInterval(battleInterval);finalizeBattle(bd.eHp<=0)}
}
function finalizeBattle(won){
  const bd=battleData;
  document.getElementById('btn-close-arena').style.display='';
  document.getElementById('btn-skip').style.display='none';
  if(won)animF('fighter-enemy','dead');else animF('fighter-ally','dead');
  setTimeout(()=>{
    if(won){
      Object.entries(bd.enemy.reward).forEach(([r,v])=>{state.resources[r]=(state.resources[r]||0)+v});
      state.glory+=bd.enemy.glory;state.hero.xp+=bd.enemy.glory;
      if(state.hero.xp>=state.hero.xpNext){
        state.hero.level++;state.hero.xp-=state.hero.xpNext;state.hero.xpNext=Math.floor(state.hero.xpNext*1.4);
        state.hero.atk+=3;state.hero.def+=2;state.hero.hp+=20;state.hero.talentPoints++;
        addBattleLog(`⭐ LEVEL UP ! ${state.hero.name} → Niv.${state.hero.level} !`,'event-line');
      }
      state.moral=Math.min(100,state.moral+10);
      state.reports.unshift({type:'victory',title:`Victoire contre ${bd.enemy.name}`,
        text:`Après ${bd.round} rounds de combat, votre armée triomphe !`,reward:bd.enemy.reward,glory:bd.enemy.glory,time:new Date().toLocaleTimeString('fr-FR')});
    }else{
      Object.keys(state.troops).forEach(t=>{const l=Math.floor((state.troops[t]||0)*.3);state.troops[t]=Math.max(0,(state.troops[t]||0)-l)});
      state.moral=Math.max(0,state.moral-20);
      state.reports.unshift({type:'defeat',title:`Défaite contre ${bd.enemy.name}`,
        text:`Votre armée est en déroute après ${bd.round} rounds. 30% des troupes perdues.`,glory:0,time:new Date().toLocaleTimeString('fr-FR')});
    }
    updateRes();updateMoral();
    const res=document.createElement('div');res.className='battle-result';
    const rStr=won?Object.entries(bd.enemy.reward).filter(([,v])=>v>0)
      .map(([r,v])=>`<span class="reward-chip">+${v} ${RES_ICONS[r]||r}</span>`).join(''):'';
    res.innerHTML=`<div class="result-card">
      <div class="result-title ${won?'victory':'defeat'}">${won?'🏆 VICTOIRE !':'💀 DÉFAITE...'}</div>
      <div class="result-sub">${won?`${bd.enemy.name} vaincu en ${bd.round} rounds !`:`Votre armée s'est retirée.`}</div>
      ${won?`<div class="result-rewards">${rStr}<span class="reward-chip">+${bd.enemy.glory} Gloire</span></div>`:''}
      <button class="btn-arena btn-close-arena" onclick="closeBattleArena()" style="display:block;width:100%">✕ Continuer</button></div>`;
    document.getElementById('battle-arena').appendChild(res);
  },700);
}
function skipBattle(){
  if(!battleData||battleData.done)return;
  clearInterval(battleInterval);
  const bd=battleData;
  const ap=bd.aAtk*3+bd.aDef*2+bd.aHp,ep=bd.eAtk*3+bd.eDef*2+bd.eHp;
  bd.round=Math.ceil(bd.eHp/Math.max(1,bd.aAtk-bd.eDef/2));bd.done=true;
  finalizeBattle(ap>=ep*(.8+Math.random()*.4));
}
function closeBattleArena(){
  document.getElementById('battle-arena').classList.remove('open');
  document.querySelector('.battle-result')?.remove();
  renderTroopList();renderHeroPanel();renderHeroSidebar();renderReports();renderCombatPanel();
}
function animF(id,anim){
  const el=document.getElementById(id);if(!el)return;
  el.classList.remove('attacking','hit','dead');void el.offsetWidth;el.classList.add(anim);
  if(anim!=='dead')setTimeout(()=>el.classList.remove(anim),500);
}
function showDmg(fId,dmg,color){
  const el=document.getElementById(fId);if(!el)return;
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='dmg-float';d.textContent='-'+dmg;
  d.style.cssText=`left:${r.left+r.width/2-15}px;top:${r.top+20}px;color:${color};font-size:${1.2+Math.random()*.5}rem`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
}
function addBattleLog(text,cls){
  const log=document.getElementById('battle-log');if(!log)return;
  const line=document.createElement('div');line.className='blog-line '+(cls||'');line.textContent=text;
  log.appendChild(line);log.scrollTop=log.scrollHeight;
}
function spawnArenaStars(){
  const sky=document.getElementById('arena-sky');
  for(let i=0;i<50;i++){const s=document.createElement('div');s.className='a-star';
    s.style.cssText=`width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
    sky.appendChild(s);}
}
function renderReports(){
  const list=document.getElementById('reports-list');
  if(!state.reports.length){list.innerHTML='<p style="color:var(--parch-dim);font-style:italic">Aucun rapport.</p>';return}
  list.innerHTML=state.reports.slice(0,20).map(r=>`
    <div class="report-card ${r.type}">
      <div class="rc-header"><div class="rc-title ${r.type}">${r.type==='victory'?'🏆':'💀'} ${r.title}</div><div class="rc-time">${r.time}</div></div>
      <div class="rc-body">${r.text}</div>
      <div class="rc-chips">
        ${r.glory>0?`<span class="gain-chip">+${r.glory} Gloire</span>`:''}
        ${r.reward?Object.entries(r.reward).filter(([,v])=>v>0).map(([k,v])=>`<span class="gain-chip">+${v} ${RES_ICONS[k]||k}</span>`).join(''):''}
      </div></div>`).join('');
}
function updateRes(){
  ['wood','stone','food','gold','runes','mead'].forEach(k=>{const el=document.getElementById('r-'+k);if(el)el.textContent=Math.floor(state.resources[k]||0);});
}
function updateMoral(){
  const m=state.moral,col=m>=60?'#6aaa50':m>=30?'#d4a017':'#e74c3c';
  const bar=document.getElementById('moral-bar'),val=document.getElementById('moral-val');
  if(bar){bar.style.width=m+'%';bar.style.background=col}
  if(val){val.textContent=m;val.style.color=col}
}
function toast(msg,type){
  const c=document.getElementById('toasts');const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');el.textContent=msg;c.appendChild(el);setTimeout(()=>el.remove(),4000);
}
setInterval(()=>{
  state.tick++;
  if(state.tick%8===0){state.resources.food+=8;state.resources.wood+=6;state.resources.stone+=4;state.resources.gold+=2;updateRes()}
  if(state.trainQueue.length){
    state.trainQueue[0].ticksLeft--;
    if(state.trainQueue[0].ticksLeft<=0){
      const q=state.trainQueue.shift();state.troops[q.id]=(state.troops[q.id]||0)+q.qty;
      toast(`✦ +${q.qty} ${q.name}(s) prêts !`,'s');renderTroopList();renderRecruitGrid();
    }else renderTrainQueue();
  }
  if(state.tick%60===0&&state.moral<100){state.moral=Math.min(100,state.moral+2);updateMoral()}
},1000);
init();
setTimeout(()=>toast('⚔ Vos guerriers sont prêts, '+state.player+' !'),500);
</script>
</body>
</html>
