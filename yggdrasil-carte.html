<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGGDRASIL — Carte</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0a04;--parch:#d4b896;--parch-dim:#8a7055;--parch-light:#f0dfc0;
  --gold:#c8960c;--gold-light:#f0c040;--gold-glow:rgba(200,150,12,.5);
  --blood:#8b1a1a;--blood-bright:#e74c3c;--moss:#4a7a35;--moss-light:#6aaa50;
  --purple:#8e44ad;--frost:#4a9abb;--border:rgba(200,150,12,.22);--panel:rgba(14,10,4,.95);
  --cell:44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'IM Fell English',Georgia,serif;background:var(--ink);color:var(--parch);overflow:hidden;user-select:none}

/* TOPBAR */
#topbar{position:relative;z-index:200;background:rgba(8,5,1,.97);border-bottom:1px solid var(--border);padding:.35rem .8rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;flex-shrink:0;box-shadow:0 2px 20px rgba(0,0,0,.8)}
.logo{font-family:'Uncial Antiqua',serif;font-size:1.1rem;color:var(--gold);letter-spacing:3px;text-shadow:0 0 15px var(--gold-glow);text-decoration:none}
.logo span{font-size:.5rem;display:block;color:var(--parch-dim);letter-spacing:3px}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.res{display:flex;align-items:center;gap:.18rem;background:rgba(200,150,12,.06);border:1px solid var(--border);border-radius:3px;padding:.13rem .38rem;font-size:.73rem}
.res .v{color:var(--parch-light);font-weight:600;min-width:20px}
.res.rare .v{color:var(--gold-light)}
.season-chip{display:flex;align-items:center;gap:.35rem;padding:.15rem .6rem;border-radius:3px;border:1px solid var(--border);font-size:.72rem;background:rgba(200,150,12,.06)}
.nav-links{margin-left:auto;display:flex;gap:.32rem}
.nav-link{font-family:'Uncial Antiqua',serif;font-size:.6rem;letter-spacing:1px;color:var(--parch-dim);text-decoration:none;padding:.2rem .5rem;border:1px solid var(--border);border-radius:3px;transition:all .2s}
.nav-link:hover,.nav-link.active{color:var(--gold);border-color:rgba(200,150,12,.5);background:rgba(200,150,12,.07)}

/* MAP LAYOUT */
#map-wrap{display:flex;flex-direction:column;height:calc(100vh - 44px);position:relative;overflow:hidden}
#map-container{flex:1;overflow:hidden;position:relative;cursor:grab}
#map-container.panning{cursor:grabbing}
#map-canvas-wrap{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#map-grid{display:grid;grid-template-columns:repeat(17,var(--cell));gap:2px;padding:8px;position:relative}

/* CELLULES */
.cell{width:var(--cell);height:var(--cell);border-radius:4px;position:relative;cursor:pointer;transition:transform .12s,filter .12s;overflow:visible;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid rgba(0,0,0,.3)}
.cell:hover:not(.fog){transform:scale(1.08);z-index:10;filter:brightness(1.25)}
.cell.fog{background:#0c0a08 !important;border-color:rgba(255,255,255,.04);cursor:default;font-size:0}
.cell.fog::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,rgba(30,20,10,.8),rgba(5,3,1,.95));border-radius:3px}

/* TERRAINS */
.t-plain  {background:linear-gradient(135deg,#2a3a1a,#354a20)}
.t-forest {background:linear-gradient(135deg,#1a3a1a,#224a22)}
.t-mountain{background:linear-gradient(135deg,#3a3a3a,#4a4a4a)}
.t-water  {background:linear-gradient(135deg,#0a2a4a,#0e3860)}
.t-tundra {background:linear-gradient(135deg,#3a3a4a,#4a4a5a)}
.t-swamp  {background:linear-gradient(135deg,#1a2a1a,#253530)}
.t-ruins  {background:linear-gradient(135deg,#2a1a0a,#3a2010)}
.t-volcano{background:linear-gradient(135deg,#3a1a0a,#5a2010)}
.t-crystal{background:linear-gradient(135deg,#0a1a3a,#12265a)}

/* MARQUEURS SPÉCIAUX */
.cell-mark{position:absolute;top:1px;right:1px;font-size:.55rem;line-height:1;z-index:5}
.cell-event{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:.55rem;z-index:5;animation:eventPulse 1.5s ease-in-out infinite}
@keyframes eventPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.3)}}
.cell-trace{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:2}
.cell-kingdom-border{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:4}

/* VILLAGES IA */
.ai-clan-marker{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;z-index:3}
.ai-clan-marker.hostile{filter:drop-shadow(0 0 4px rgba(231,76,60,.6))}
.ai-clan-marker.neutral{filter:drop-shadow(0 0 4px rgba(200,150,12,.4))}
.ai-clan-marker.ally{filter:drop-shadow(0 0 4px rgba(106,170,80,.5))}

/* BROUILLARD PARTIEL */
.cell.partial-fog::after{content:'';position:absolute;inset:0;background:rgba(5,3,1,.55);border-radius:3px;pointer-events:none;z-index:6}

/* MINIMAP */
#minimap-wrap{position:absolute;bottom:60px;right:10px;z-index:150;background:rgba(8,5,1,.92);border:1px solid var(--border);border-radius:5px;padding:5px;box-shadow:0 4px 20px rgba(0,0,0,.7)}
#minimap{width:136px;height:136px;display:grid;grid-template-columns:repeat(17,8px);gap:0;position:relative}
.mm-cell{width:8px;height:8px;border-radius:1px}
#mm-viewport{position:absolute;border:1px solid var(--gold);border-radius:2px;pointer-events:none;transition:all .1s}
#minimap-wrap label{font-size:.55rem;color:var(--parch-dim);letter-spacing:1px;text-transform:uppercase;display:block;text-align:center;margin-bottom:3px}

/* BOTTOM BAR */
#bottombar{position:relative;z-index:200;background:rgba(8,5,1,.97);border-top:1px solid var(--border);padding:.3rem .8rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.bb-item{font-size:.72rem;color:var(--parch-dim);display:flex;align-items:center;gap:.28rem}
.bb-item b{color:var(--parch-light)}
.moral-bar-bg{width:55px;height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;display:inline-block}
.moral-bar{height:100%;border-radius:3px;transition:width .5s,background .5s}
#day-counter{font-family:'Uncial Antiqua',serif;font-size:.8rem;color:var(--gold)}

/* MENU RADIAL */
#radial-menu{position:fixed;z-index:500;display:none;pointer-events:none}
#radial-menu.open{display:block;pointer-events:all}
.rm-ring{position:absolute;transform:translate(-50%,-50%)}
.rm-btn{position:absolute;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;border:2px solid var(--border);background:rgba(10,6,2,.97);transition:all .2s;transform:translate(-50%,-50%);box-shadow:0 2px 12px rgba(0,0,0,.7)}
.rm-btn:hover{transform:translate(-50%,-50%) scale(1.18);border-color:var(--gold);background:rgba(30,18,4,.98);box-shadow:0 0 12px var(--gold-glow)}
.rm-center{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;border:2px solid var(--gold);background:rgba(10,6,2,.97);position:absolute;transform:translate(-50%,-50%);box-shadow:0 0 15px var(--gold-glow)}
.rm-label{position:absolute;font-size:.58rem;color:var(--parch-dim);white-space:nowrap;text-align:center;transform:translate(-50%,-50%);pointer-events:none;background:rgba(8,5,1,.85);padding:.1rem .3rem;border-radius:2px}

/* SIDE PANEL */
#side-panel{position:absolute;right:0;top:0;bottom:0;width:280px;background:var(--panel);border-left:1px solid var(--border);z-index:300;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;display:flex;flex-direction:column}
#side-panel::-webkit-scrollbar{width:3px}#side-panel::-webkit-scrollbar-thumb{background:var(--border)}
#side-panel.open{transform:translateX(0)}
.sp-header{padding:.8rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.sp-title{font-family:'Uncial Antiqua',serif;font-size:.95rem;color:var(--gold-light);letter-spacing:1px;flex:1}
.sp-close{background:none;border:none;color:var(--parch-dim);font-size:1.1rem;cursor:pointer;padding:.2rem}
.sp-close:hover{color:var(--parch)}
.sp-body{padding:.9rem 1rem;flex:1}
.sp-section{margin-bottom:.9rem}
.sp-sec-title{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--parch-dim);margin-bottom:.4rem;padding-bottom:.25rem;border-bottom:1px solid rgba(200,150,12,.1)}
.sp-stat-row{display:flex;justify-content:space-between;font-size:.78rem;padding:.18rem 0;border-bottom:1px solid rgba(200,150,12,.04)}
.sp-stat-row span:last-child{color:var(--parch-light);font-weight:600}
.sp-btn{width:100%;padding:.38rem;font-family:'Uncial Antiqua',serif;font-size:.72rem;letter-spacing:1px;border-radius:3px;cursor:pointer;transition:all .2s;margin-bottom:.35rem}
.sp-btn-gold{background:rgba(200,150,12,.1);border:1px solid rgba(200,150,12,.4);color:var(--gold)}
.sp-btn-gold:hover{background:rgba(200,150,12,.22)}
.sp-btn-red{background:rgba(139,26,26,.1);border:1px solid rgba(139,26,26,.5);color:var(--blood-bright)}
.sp-btn-red:hover{background:rgba(139,26,26,.22)}
.sp-btn-green{background:rgba(74,122,53,.1);border:1px solid rgba(106,170,80,.4);color:var(--moss-light)}
.sp-btn-green:hover{background:rgba(74,122,53,.22)}
.sp-btn-purple{background:rgba(142,68,173,.1);border:1px solid rgba(142,68,173,.4);color:#c070e0}
.sp-btn-purple:hover{background:rgba(142,68,173,.22)}
.rep-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;border-radius:10px;font-size:.68rem}
.rep-hostile{background:rgba(139,26,26,.2);border:1px solid rgba(231,76,60,.4);color:var(--blood-bright)}
.rep-neutral{background:rgba(200,150,12,.12);border:1px solid rgba(200,150,12,.4);color:var(--gold)}
.rep-ally{background:rgba(74,122,53,.15);border:1px solid rgba(106,170,80,.4);color:var(--moss-light)}
.rep-wary{background:rgba(90,138,176,.12);border:1px solid rgba(90,138,176,.4);color:var(--frost)}

/* EVENTS OVERLAY */
#events-log{position:absolute;left:10px;top:10px;z-index:150;max-width:220px;pointer-events:none}
.ev-line{background:rgba(8,5,1,.92);border:1px solid var(--border);border-radius:3px;padding:.3rem .6rem;font-size:.7rem;color:var(--parch);margin-bottom:.3rem;animation:evIn .3s ease,evOut .3s ease 4s forwards}
.ev-line.hostile{border-color:rgba(231,76,60,.5);color:var(--blood-bright)}
.ev-line.divine{border-color:rgba(142,68,173,.5);color:#c070e0}
.ev-line.good{border-color:rgba(106,170,80,.5);color:var(--moss-light)}
@keyframes evIn{from{opacity:0;transform:translateX(-15px)}}
@keyframes evOut{to{opacity:0;transform:translateX(-15px)}}

/* WEATHER OVERLAY */
#weather-overlay{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.weather-particle{position:absolute;pointer-events:none;animation:weatherFall linear infinite}
@keyframes weatherFall{from{transform:translateY(-20px)}to{transform:translateY(100vh)}}

/* ZOOM CONTROLS */
#zoom-ctrl{position:absolute;bottom:65px;left:10px;z-index:150;display:flex;flex-direction:column;gap:.3rem}
.zoom-btn{width:30px;height:30px;background:rgba(8,5,1,.92);border:1px solid var(--border);color:var(--parch);font-size:1rem;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.zoom-btn:hover{border-color:var(--gold);color:var(--gold)}

/* KINGDOM LEGEND */
#kingdom-legend{position:absolute;top:10px;right:10px;z-index:150;background:rgba(8,5,1,.92);border:1px solid var(--border);border-radius:4px;padding:.5rem .7rem;font-size:.65rem;color:var(--parch-dim)}
#kingdom-legend.hidden{display:none}
.kl-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.22rem}
.kl-dot{width:8px;height:8px;border-radius:50%}

/* SPY ANIMATION */
.spy-anim{position:fixed;z-index:600;font-size:1.5rem;animation:spyMove 2s ease-in-out forwards;pointer-events:none}
@keyframes spyMove{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.5) translateY(-40px)}}

/* TOAST */
#toasts{position:fixed;bottom:55px;right:10px;z-index:9999;display:flex;flex-direction:column;gap:.3rem;pointer-events:none}
.toast{background:rgba(8,5,1,.97);border:1px solid var(--gold);border-radius:3px;padding:.4rem .8rem;font-size:.78rem;color:var(--parch-light);box-shadow:0 4px 20px rgba(0,0,0,.7);animation:tIn .3s cubic-bezier(.34,1.56,.64,1),tOut .3s ease 3.5s forwards;max-width:260px}
.toast.s{border-color:var(--moss-light)}.toast.d{border-color:var(--blood-bright)}.toast.divine{border-color:#c070e0}.toast.info{border-color:var(--frost)}
@keyframes tIn{from{opacity:0;transform:translateX(25px)}}
@keyframes tOut{to{opacity:0;transform:translateX(25px)}}
</style>
</head>

<script>
// ═══════════════════════════════════════════════
//  CONSTANTES
// ═══════════════════════════════════════════════
const GRID=17,CELL=44,GAP=2,PAD=8;

const TERRAIN_TYPES=['plain','forest','mountain','water','tundra','swamp','ruins','volcano','crystal'];
const TERRAIN_ICONS={plain:'🌿',forest:'🌲',mountain:'⛰',water:'🌊',tundra:'🧊',swamp:'🌫',ruins:'🏚',volcano:'🌋',crystal:'💎'};
const TERRAIN_NAMES={plain:'Plaine',forest:'Forêt',mountain:'Montagne',water:'Eau',tundra:'Toundra',swamp:'Marais',ruins:'Ruines',volcano:'Volcan',crystal:'Cristaux'};

};

const AI_CLANS=[
  {id:'ulf',name:'Clan Ulfhéðnar',icon:'🐺',rep:'hostile',strength:65,x:13,y:3,wealth:200,growing:true},
  {id:'hel',name:'Guerriers de Hel',icon:'💀',rep:'hostile',strength:80,x:15,y:8,wealth:350,growing:false},

  {id:'sol',name:'Alliance Sólveig',icon:'☀',rep:'ally',strength:55,x:4,y:14,wealth:280,growing:true},
  {id:'raven',name:'Clan du Corbeau',icon:'🦅',rep:'wary',strength:45,x:10,y:15,wealth:180,growing:false},

  {id:'resource_node',icon:'💰',label:'Ressources découvertes',cls:'good',prob:.06},

];

const SEASONS=[
  {key:'spring',label:'Printemps',icon:'🌱',color:'#6aaa50',prod:1.3,desc:'Production +30% · 🌊 Routes inondées'},
  {key:'summer',label:'Été',icon:'☀',color:'#f0c040',prod:1.1,desc:'Recrutement accéléré · 🔥 IA ultra-agressive'},

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
const G={
  resources:{wood:480,stone:320,food:610,gold:145,runes:12,mead:28,souls:3},
  glory:1240,moral:75,day:34,seasonIdx:2,tick:0,
  scale:1,panX:0,panY:0,isPanning:false,panStart:{x:0,y:0},
  grid:[],explored:new Set(),partial:new Set(),
  events:{},aiWars:{},spyActive:false,
  playerCell:{x:8,y:8},
  selectedCell:null,
};

// ═══════════════════════════════════════════════
//  GÉNÉRATION CARTE
// ═══════════════════════════════════════════════
function weightedRandom(weights){
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return i;}
  return weights.length-1;
}

function getKingdom(x,y){
  if(x<10&&y<10)return'midgard';
  if(x>=10&&y<9)return'jotunheim';
  if(x<6&&y>=12)return'niflheim';
  return'muspelheim';
}

function generateGrid(){
  const grid=[];
  for(let y=0;y<GRID;y++){
    const row=[];
    for(let x=0;x<GRID;x++){
      const terrain=TERRAIN_TYPES[weightedRandom(TERRAIN_WEIGHTS)];
      const kingdom=getKingdom(x,y);
      const cell={x,y,terrain,kingdom,
        event:null,aiClan:null,resource:null,
        traces:[],explored:false,
        isPlayerVillage:x===8&&y===8,
        isAllyVillage:x===5&&y===11,
        isDungeon:false,isRuins:false,
      };
      // Forcer terrain logique
      if(x===8&&y===8){cell.terrain='plain';cell.isPlayerVillage=true}
      if(x===5&&y===11){cell.terrain='plain';cell.isAllyVillage=true}
      // Donjons rares
      if(Math.random()<.04&&terrain==='ruins')cell.isDungeon=true;
      // Ressources spéciales
      if(Math.random()<.08)cell.resource={type:['runes','gold','mead','souls'][Math.floor(Math.random()*4)],amount:Math.floor(Math.random()*10)+5,depleted:false};
      row.push(cell);
    }
    grid.push(row);
  }
  // Placer les clans IA
  AI_CLANS.forEach(clan=>{
    if(clan.x<GRID&&clan.y<GRID)grid[clan.y][clan.x].aiClan=clan.id;
  });
  // Quelques événements aléatoires initiaux
  for(let i=0;i<8;i++){
    const x=Math.floor(Math.random()*GRID),y=Math.floor(Math.random()*GRID);
    const ev=EVENT_TYPES[Math.floor(Math.random()*4)];
    grid[y][x].event=ev.id;
  }
  return grid;
}

function exploreAround(cx,cy,radius=1){
  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GRID||ny>=GRID)continue;
      const key=`${nx},${ny}`;
      G.explored.add(key);
      G.partial.delete(key);
      // Partiellement visible au-delà
      if(Math.abs(dx)===radius||Math.abs(dy)===radius){
        for(let ody=-1;ody<=1;ody++){
          for(let odx=-1;odx<=1;odx++){
            const ox=nx+odx,oy=ny+ody;
            if(ox<0||oy<0||ox>=GRID||oy>=GRID)continue;
            const ok=`${ox},${oy}`;
            if(!G.explored.has(ok))G.partial.add(ok);
          }
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════
//  RENDU GRILLE
// ═══════════════════════════════════════════════
function renderGrid(){
  const container=document.getElementById('map-grid');
  container.innerHTML='';
  for(let y=0;y<GRID;y++){
    for(let x=0;x<GRID;x++){
      const cell=G.grid[y][x];
      const key=`${x},${y}`;
      const explored=G.explored.has(key);
      const partial=G.partial.has(key);
      const el=document.createElement('div');
      el.className=`cell t-${cell.terrain}`;
      el.id=`cell-${x}-${y}`;
      if(!explored&&!partial){
        el.classList.add('fog');
      } else {
        if(partial)el.classList.add('partial-fog');
        // Kingdom border tint
        const kg=KINGDOM_REGIONS[cell.kingdom];
        el.style.boxShadow=`inset 0 0 0 2px ${kg.border}`;
        // Icône terrain
        let inner='';
        if(cell.isPlayerVillage){inner='🏰';el.title='Votre Village'}
        else if(cell.isAllyVillage){inner='🤝';el.title='Village Allié'}
        else if(cell.aiClan){
          const clan=AI_CLANS.find(c=>c.id===cell.aiClan);
          inner=`<div class="ai-clan-marker ${clan?.rep||'neutral'}">${clan?.icon||'🏴'}</div>`;
        }
        else if(cell.isDungeon){inner='🏛';el.title='Donjon'}
        else inner=TERRAIN_ICONS[cell.terrain]||'';
        // Event indicator
        if(cell.event){
          const ev=EVENT_TYPES.find(e=>e.id===cell.event);
          inner+=`<div class="cell-event">${ev?.icon||'!'}</div>`;
        }
        // Resource indicator
        if(cell.resource&&!cell.resource.depleted){
          inner+=`<div class="cell-mark">${RES_ICONS[cell.resource.type]||'💫'}</div>`;
        }
        // Traces
        if(cell.traces&&cell.traces.length>0){
          el.style.outline=`1px dashed ${cell.traces[0]==='battle'?'rgba(231,76,60,.5)':'rgba(200,150,12,.4)'}`;
        }
        el.innerHTML=inner;
        el.addEventListener('click',()=>onCellClick(x,y,el));
        el.addEventListener('contextmenu',e=>{e.preventDefault();onCellRightClick(x,y,e)});
      }
      container.appendChild(el);
    }
  }
  renderMinimap();
}

function renderCell(x,y){
  const el=document.getElementById(`cell-${x}-${y}`);
  if(!el)return;
  const cell=G.grid[y][x];
  const key=`${x},${y}`;
  const explored=G.explored.has(key);
  const partial=G.partial.has(key);
  el.className=`cell t-${cell.terrain}`;
  if(!explored&&!partial){el.classList.add('fog');el.innerHTML='';return}
  if(partial)el.classList.add('partial-fog');
  const kg=KINGDOM_REGIONS[cell.kingdom];
  el.style.boxShadow=`inset 0 0 0 2px ${kg.border}`;
  let inner='';
  if(cell.isPlayerVillage)inner='🏰';
  else if(cell.isAllyVillage)inner='🤝';
  else if(cell.aiClan){const clan=AI_CLANS.find(c=>c.id===cell.aiClan);inner=`<div class="ai-clan-marker ${clan?.rep||'neutral'}">${clan?.icon||'🏴'}</div>`;}
  else if(cell.isDungeon)inner='🏛';
  else inner=TERRAIN_ICONS[cell.terrain]||'';
  if(cell.event){const ev=EVENT_TYPES.find(e=>e.id===cell.event);inner+=`<div class="cell-event">${ev?.icon||'!'}</div>`;}
  if(cell.resource&&!cell.resource.depleted)inner+=`<div class="cell-mark">${RES_ICONS[cell.resource.type]||'💫'}</div>`;
  if(cell.traces&&cell.traces.length>0)el.style.outline=`1px dashed ${cell.traces[0]==='battle'?'rgba(231,76,60,.5)':'rgba(200,150,12,.4)'}`;
  else el.style.outline='';
  el.innerHTML=inner;
}

// ═══════════════════════════════════════════════
//  MINIMAP
// ═══════════════════════════════════════════════
function renderMinimap(){
  const mm=document.getElementById('minimap');
  // Remove old cells but keep viewport
  [...mm.children].forEach(c=>{if(c.id!=='mm-viewport')c.remove()});
  const frag=document.createDocumentFragment();
  for(let y=0;y<GRID;y++){
    for(let x=0;x<GRID;x++){
      const d=document.createElement('div');
      d.className='mm-cell';
      const key=`${x},${y}`;
      const cell=G.grid[y][x];
      if(!G.explored.has(key)&&!G.partial.has(key)){d.style.background='#0c0a08';}
      else if(cell.isPlayerVillage){d.style.background='#c8960c';}
      else if(cell.isAllyVillage){d.style.background='#6aaa50';}
      else if(cell.aiClan){const clan=AI_CLANS.find(c=>c.id===cell.aiClan);d.style.background=clan?.rep==='hostile'?'#e74c3c':clan?.rep==='ally'?'#6aaa50':'#d4a017';}
      else{const colors={plain:'#2a3a1a',forest:'#1a3a1a',mountain:'#3a3a3a',water:'#0e3860',tundra:'#3a3a4a',swamp:'#253530',ruins:'#3a2010',volcano:'#5a2010',crystal:'#12265a'};d.style.background=colors[cell.terrain]||'#1a1a1a';}
      if(G.partial.has(key))d.style.opacity='.4';
      frag.appendChild(d);
    }
  }
  mm.insertBefore(frag,mm.firstChild);
  updateMinimapViewport();
}

function updateMinimapViewport(){
  const vp=document.getElementById('mm-viewport');
  const mapW=GRID*(CELL+GAP)+PAD*2,mapH=GRID*(CELL+GAP)+PAD*2;
  const contW=document.getElementById('map-container').offsetWidth;
  const contH=document.getElementById('map-container').offsetHeight;
  const visW=contW/G.scale,visH=contH/G.scale;
  const startX=-G.panX/G.scale,startY=-G.panY/G.scale;
  const mmScale=136/mapW;
  vp.style.left=(startX*mmScale)+'px';
  vp.style.top=(startY*mmScale)+'px';
  vp.style.width=(visW*mmScale)+'px';
  vp.style.height=(visH*mmScale)+'px';
}

// ═══════════════════════════════════════════════
//  PAN & ZOOM
// ═══════════════════════════════════════════════
function applyTransform(){
  document.getElementById('map-canvas-wrap').style.transform=`translate(${G.panX}px,${G.panY}px) scale(${G.scale})`;
  updateMinimapViewport();
}

function zoom(dir){
  const prev=G.scale;
  G.scale=Math.max(.45,Math.min(1.6,G.scale+dir*.12));
  const cont=document.getElementById('map-container');
  const cx=cont.offsetWidth/2,cy=cont.offsetHeight/2;
  G.panX=cx-(cx-G.panX)*G.scale/prev;
  G.panY=cy-(cy-G.panY)*G.scale/prev;
  applyTransform();
}

function centerOnVillage(){
  const cont=document.getElementById('map-container');
  const cellW=CELL+GAP;
  const vx=G.playerCell.x*cellW+PAD+CELL/2;
  const vy=G.playerCell.y*cellW+PAD+CELL/2;
  G.panX=cont.offsetWidth/2-vx*G.scale;
  G.panY=cont.offsetHeight/2-vy*G.scale;
  applyTransform();
}

(()=>{
  const mc=document.getElementById('map-container');
  let startPanX=0,startPanY=0;
  mc.addEventListener('mousedown',e=>{
    if(e.target.closest('.cell')||e.button!==0)return;
    G.isPanning=true;mc.classList.add('panning');
    startPanX=e.clientX-G.panX;startPanY=e.clientY-G.panY;
  });
  mc.addEventListener('mousemove',e=>{
    if(!G.isPanning)return;
    G.panX=e.clientX-startPanX;G.panY=e.clientY-startPanY;
    applyTransform();
  });
  mc.addEventListener('mouseup',()=>{G.isPanning=false;mc.classList.remove('panning')});
  mc.addEventListener('mouseleave',()=>{G.isPanning=false;mc.classList.remove('panning')});
  mc.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1:-1)},{passive:false});
  // Touch
  let lastTouchDist=0,touchStartX=0,touchStartY=0;
  mc.addEventListener('touchstart',e=>{
    if(e.touches.length===2){lastTouchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
    else{touchStartX=e.touches[0].clientX-G.panX;touchStartY=e.touches[0].clientY-G.panY;}
  },{passive:true});
  mc.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(lastTouchDist)zoom(d>lastTouchDist?1:-1);lastTouchDist=d;
    }else{G.panX=e.touches[0].clientX-touchStartX;G.panY=e.touches[0].clientY-touchStartY;applyTransform();}
  },{passive:false});
})();

// ═══════════════════════════════════════════════
//  CLIC CELLULE
// ═══════════════════════════════════════════════
function onCellClick(x,y,el){
  const key=`${x},${y}`;
  if(!G.explored.has(key)){
    // Explorer si adjacent
    const px=G.playerCell.x,py=G.playerCell.y;
    if(Math.abs(x-px)<=3&&Math.abs(y-py)<=3){
      exploreAround(x,y,1);renderGrid();
      addEventLog(`🔭 Zone (${x},${y}) explorée`,'')}
    return;
  }
  G.selectedCell={x,y};
  showRadialMenu(x,y,el);
}

function onCellRightClick(x,y,e){
  const key=`${x},${y}`;
  if(!G.explored.has(key))return;
  showSidePanel(x,y);
}

// ═══════════════════════════════════════════════
//  MENU RADIAL
// ═══════════════════════════════════════════════
function showRadialMenu(x,y,el){
  closeRadialMenu();
  const cell=G.grid[y][x];
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const menu=document.getElementById('radial-menu');
  menu.innerHTML='';
  menu.classList.add('open');
  menu.style.left=cx+'px';menu.style.top=cy+'px';

  const actions=getActionsForCell(cell);
  const radius=55;
  // Centre
  const center=document.createElement('div');
  center.className='rm-center';center.style.left='0px';center.style.top='0px';
  center.textContent=cell.isPlayerVillage?'🏰':cell.aiClan?AI_CLANS.find(c=>c.id===cell.aiClan)?.icon||'?':TERRAIN_ICONS[cell.terrain];
  center.onclick=()=>{showSidePanel(x,y);closeRadialMenu()};
  menu.appendChild(center);

  actions.forEach((a,i)=>{
    const angle=(i/actions.length)*Math.PI*2-Math.PI/2;
    const bx=Math.cos(angle)*radius,by=Math.sin(angle)*radius;
    const btn=document.createElement('div');
    btn.className='rm-btn';btn.style.left=bx+'px';btn.style.top=by+'px';
    btn.textContent=a.icon;btn.title=a.label;
    btn.onclick=()=>{a.fn(x,y);closeRadialMenu()};
    const lbl=document.createElement('div');
    lbl.className='rm-label';lbl.style.left=(bx+Math.cos(angle)*24)+'px';lbl.style.top=(by+Math.sin(angle)*24)+'px';
    lbl.textContent=a.label;
    menu.appendChild(btn);menu.appendChild(lbl);
  });

  // Close on outside click
  setTimeout(()=>document.addEventListener('click',closeRadialMenuOnOutside),50);
}
function closeRadialMenuOnOutside(e){
  if(!e.target.closest('#radial-menu')){closeRadialMenu();document.removeEventListener('click',closeRadialMenuOnOutside)}}
function closeRadialMenu(){document.getElementById('radial-menu').classList.remove('open')}

function getActionsForCell(cell){
  const actions=[];
  if(cell.isPlayerVillage)return[
    {icon:'🏘',label:'Village',fn:()=>window.location.href='yggdrasil-village.html'},
    {icon:'⚔',label:'Armée',fn:()=>window.location.href='yggdrasil-armee.html'},
    {icon:'📜',label:'Quêtes',fn:()=>window.location.href='yggdrasil-quetes.html'},
  ];
  if(cell.aiClan){
    const clan=AI_CLANS.find(c=>c.id===cell.aiClan);
    return[
      {icon:'⚔',label:'Attaquer',fn:(x,y)=>attackClan(x,y)},
      {icon:'🤝',label:'Négocier',fn:(x,y)=>negotiateClan(x,y)},
      {icon:'🕵',label:'Espionner',fn:(x,y)=>spyClan(x,y)},
      {icon:'🎁',label:'Tribut',fn:(x,y)=>tributeClan(x,y)},
    ];
  }
  if(cell.isAllyVillage)return[
    {icon:'💬',label:'Chat',fn:()=>window.location.href='yggdrasil-alliance.html'},
    {icon:'🧑‍🌾',label:'Péon',fn:()=>window.location.href='yggdrasil-alliance.html'},
  ];
  const base=[{icon:'🔭',label:'Explorer',fn:(x,y)=>{exploreAround(x,y,2);renderGrid();toast('🔭 Zone explorée !')}},{icon:'ℹ',label:'Infos',fn:(x,y)=>showSidePanel(x,y)}];
  if(cell.event)base.unshift({icon:'❗',label:'Événement',fn:(x,y)=>resolveEvent(x,y)});
  if(cell.resource&&!cell.resource.depleted)base.unshift({icon:'⛏',label:'Récolter',fn:(x,y)=>harvestResource(x,y)});
  if(cell.isDungeon)base.unshift({icon:'🏛',label:'Explorer donjon',fn:(x,y)=>exploreDungeon(x,y)});
  return base;
}

    html+=`<div class="sp-section">
      <div class="sp-sec-title">Traces</div>
      ${cell.traces.map(t=>`<div class="sp-stat-row"><span>${t==='battle'?'⚔ Bataille récente':'🔎 Passage espion'}</span></div>`).join('')}
    </div>`;
  }
  // Production terrain
  const prodRes=TERRAIN_RES[cell.terrain];
  if(prodRes){
    html+=`<div class="sp-section">
      <div class="sp-sec-title">Production locale</div>
      ${Object.entries(prodRes).map(([r,v])=>`<div class="sp-stat-row"><span>${RES_ICONS[r]||r}</span><span>+${v}/tour</span></div>`).join('')}
    </div>`;
  }

  document.getElementById('sp-body').innerHTML=html;
}
function closeSidePanel(){document.getElementById('side-panel').classList.remove('open')}

// ═══════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════
function attackClan(x,y){
  const cell=G.grid[y][x];
  const clan=AI_CLANS.find(c=>c.id===cell.aiClan);if(!clan)return;
  const roll=Math.random();
  const winChance=clan.rep==='hostile'?.45:clan.rep==='neutral'?.6:.35;
  if(roll<winChance){
    const loot=Math.floor(clan.wealth*.2);
    G.resources.gold+=loot;G.glory+=60;
    clan.wealth=Math.max(0,clan.wealth-loot);
    clan.rep='hostile';clan.strength=Math.max(10,clan.strength-15);
    cell.traces.push('battle');
    addEventLog(`⚔ Victoire sur ${clan.name} ! +${loot}🪙 +60 Gloire`,'good');
    toast(`⚔ Victoire ! +${loot}🪙`,'s');
  }else{
    const loss=Math.floor(G.resources.gold*.05);
    G.resources.gold=Math.max(0,G.resources.gold-loss);
    G.moral=Math.max(0,G.moral-10);
    cell.traces.push('battle');
    addEventLog(`💀 Défaite contre ${clan.name}. -${loss}🪙`,'hostile');
    toast(`💀 Défaite contre ${clan.name}`,'d');
  }
  renderCell(x,y);updateRes();updateMoral();
}

function negotiateClan(x,y){
  const cell=G.grid[y][x];
  const clan=AI_CLANS.find(c=>c.id===cell.aiClan);if(!clan)return;
  if(G.resources.gold<50){toast('❌ 50🪙 nécessaires pour négocier','d');return}
  G.resources.gold-=50;
  if(clan.rep==='hostile'){clan.rep='wary';toast(`🤝 ${clan.name} vous considère moins hostile`,'info');}
  else if(clan.rep==='wary'){clan.rep='neutral';toast(`🤝 ${clan.name} est maintenant neutre`,'info');}
  else if(clan.rep==='neutral'){clan.rep='ally';toast(`✦ ${clan.name} est maintenant votre allié !`,'s');G.glory+=50;}
  addEventLog(`🤝 Négociation avec ${clan.name} — Réputation améliorée`,'good');
  updateRes();showSidePanel(x,y);
}

function spyClan(x,y){
  const cell=G.grid[y][x];
  const clan=AI_CLANS.find(c=>c.id===cell.aiClan);if(!clan)return;
  if(G.spyActive){toast('🕵 Un espion est déjà en mission !','d');return}
  G.spyActive=true;
  // Animation espion
  const el=document.getElementById(`cell-${x}-${y}`);
  const rect=el?.getBoundingClientRect();
  if(rect){
    const spy=document.createElement('div');spy.className='spy-anim';spy.textContent='🕵';
    spy.style.left=(rect.left+rect.width/2-12)+'px';spy.style.top=(rect.top-10)+'px';
    document.body.appendChild(spy);setTimeout(()=>spy.remove(),2100);
  }
  setTimeout(()=>{
    G.spyActive=false;
    cell.traces.push('spy');renderCell(x,y);
    const report=`${clan.name} : Force ${clan.strength}pts, Richesse ~${clan.wealth}🪙, ${clan.growing?'en expansion':'stable'}`;
    toast(`🕵 Rapport : ${report}`,'info');
    addEventLog(`🕵 Espionnage de ${clan.name} réussi`,'');
  },2000);
  toast('🕵 Espion envoyé…','info');
}

function tributeClan(x,y){
  const cell=G.grid[y][x];
  const clan=AI_CLANS.find(c=>c.id===cell.aiClan);if(!clan)return;
  const amt=80;
  if(G.resources.gold<amt){toast(`❌ ${amt}🪙 nécessaires pour un tribut`,'d');return}
  G.resources.gold-=amt;
  if(clan.rep==='hostile')clan.rep='wary';
  else if(clan.rep==='wary')clan.rep='neutral';
  toast(`🎁 Tribut envoyé à ${clan.name} (${amt}🪙) — Paix temporaire`,'info');
  addEventLog(`🎁 Tribut à ${clan.name}`,'');
  updateRes();showSidePanel(x,y);
}

function harvestResource(x,y){
  const cell=G.grid[y][x];
  if(!cell.resource||cell.resource.depleted)return;
  const r=cell.resource;
  G.resources[r.type]=(G.resources[r.type]||0)+r.amount;
  G.glory+=10;r.depleted=true;
  toast(`⛏ +${r.amount} ${RES_ICONS[r.type]||r.type} récoltés !`,'s');
  addEventLog(`⛏ Récolte : +${r.amount} ${r.type}`,'good');
  renderCell(x,y);updateRes();
}

function exploreDungeon(x,y){
  const cell=G.grid[y][x];if(!cell.isDungeon)return;
  cell.isDungeon=false;
  const rewards={runes:Math.floor(Math.random()*6)+3,gold:Math.floor(Math.random()*60)+30};
  Object.entries(rewards).forEach(([r,v])=>{G.resources[r]=(G.resources[r]||0)+v});
  G.glory+=80;
  cell.traces.push('battle');
  toast(`🏛 Donjon exploré ! +${rewards.runes}ᚱ +${rewards.gold}🪙 +80 Gloire`,'s');
  addEventLog(`🏛 Donjon conquis ! +80 Gloire`,'good');
  renderCell(x,y);updateRes();
}

function resolveEvent(x,y){
  const cell=G.grid[y][x];if(!cell.event)return;
  const ev=EVENT_TYPES.find(e=>e.id===cell.event);
  const outcomes={
    raid_incoming:()=>{G.moral=Math.max(0,G.moral-8);toast('⚔ Raid repoussé ! -8 moral','d');addEventLog('⚔ Raid repoussé !','hostile')},
    resource_node:()=>{const r=Math.floor(Math.random()*50)+20;G.resources.wood+=r;toast(`💰 +${r}🪵 trouvés !`,'s')},
    merchant:()=>{G.resources.gold+=30;toast('🧑‍💼 Marchand : +30🪙','s')},
    storm:()=>{G.resources.food=Math.max(0,G.resources.food-40);toast('⛈ Tempête ! -40🌾','d')},
    divine_sign:()=>{G.resources.runes+=3;G.glory+=50;toast('🦅 Signe d\'Odin ! +3ᚱ +50 Gloire','divine');addEventLog('🦅 Signe divin reçu !','divine')},
    ruins_found:()=>{G.resources.runes+=2;G.resources.gold+=25;toast('🏚 Ruines : +2ᚱ +25🪙','s')},
    clan_war:()=>{const c=AI_CLANS[Math.floor(Math.random()*AI_CLANS.length)];c.strength+=15;toast(`💥 Guerre : ${c.name} grandit !`,'d')},
    alliance_request:()=>{toast('🤝 Demande d\'alliance reçue !','info')},
  };
  outcomes[cell.event]?.();
  cell.event=null;renderCell(x,y);updateRes();updateMoral();
}

// ═══════════════════════════════════════════════
//  WEATHER
// ═══════════════════════════════════════════════
function spawnWeatherParticles(){
  const ov=document.getElementById('weather-overlay');
  ov.innerHTML='';
  const s=SEASONS[G.seasonIdx];
  if(s.key==='winter'){
    for(let i=0;i<40;i++){
      const p=document.createElement('div');p.className='weather-particle';
      p.textContent='❄';p.style.cssText=`left:${Math.random()*100}%;font-size:${.6+Math.random()*.5}rem;opacity:${.3+Math.random()*.4};animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
      ov.appendChild(p);
    }
  }else if(s.key==='autumn'){
    for(let i=0;i<20;i++){
      const p=document.createElement('div');p.className='weather-particle';
      p.textContent=['🍂','🍁'][Math.floor(Math.random()*2)];
      p.style.cssText=`left:${Math.random()*100}%;font-size:${.5+Math.random()*.4}rem;opacity:${.2+Math.random()*.3};animation-duration:${5+Math.random()*5}s;animation-delay:${Math.random()*5}s`;
      ov.appendChild(p);
    }
  }
}

function updateSeasonUI(){
  const s=SEASONS[G.seasonIdx];
  const chip=document.getElementById('season-chip');
  if(chip)chip.innerHTML=`${s.icon} ${s.label} · Jour <span id="day-num">${G.day}</span>`;
  const bb=document.getElementById('bb-season');
  if(bb)bb.textContent=`${s.icon} ${s.label} · ${s.desc}`;
  document.getElementById('day-counter').textContent=`Jour ${G.day}`;
  spawnWeatherParticles();
}

// ═══════════════════════════════════════════════
//  IA VIVANTE
// ═══════════════════════════════════════════════
function tickAI(){
  // Clans grandissent / s'affrontent
  AI_CLANS.forEach(clan=>{
    if(clan.growing&&Math.random()<.3)clan.strength=Math.min(120,clan.strength+1);
    if(Math.random()<.05)clan.wealth+=Math.floor(Math.random()*20)+5;
  });
  // Guerres entre clans IA
  if(Math.random()<.04){
    const hostile=AI_CLANS.filter(c=>c.rep==='hostile');
    const neutral=AI_CLANS.filter(c=>c.rep==='neutral');
    if(hostile.length&&neutral.length){
      const att=hostile[Math.floor(Math.random()*hostile.length)];
      const def=neutral[Math.floor(Math.random()*neutral.length)];
      const w=att.strength>def.strength;
      if(w){def.strength=Math.max(5,def.strength-10);att.wealth+=30;}
      else{att.strength=Math.max(5,att.strength-8);}
      addEventLog(`💥 ${att.name} attaque ${def.name} — ${w?att.name+' gagne':def.name+' résiste'}!`,'hostile');
    }
  }
  // Clans IA font des demandes
  if(Math.random()<.025){
    const ally=AI_CLANS.find(c=>c.rep==='ally');
    if(ally)addEventLog(`🤝 ${ally.name} demande ${Math.floor(Math.random()*30)+20}🪙 de soutien`,'');
  }
  // Événements aléatoires sur carte
  if(Math.random()<.06){
    const ex=[...G.explored];
    if(ex.length){
      const [kx,ky]=ex[Math.floor(Math.random()*ex.length)].split(',').map(Number);
      const cell=G.grid[ky]?.[kx];
      if(cell&&!cell.event&&!cell.isPlayerVillage&&!cell.isAllyVillage&&!cell.aiClan){
        const ev=EVENT_TYPES.filter(e=>e.prob).sort(()=>Math.random()-.5)[0];
        cell.event=ev.id;renderCell(kx,ky);
        addEventLog(`${ev.icon} ${ev.label} en (${kx},${ky})`,(ev.cls||''));
      }
    }
  }
}

// ═══════════════════════════════════════════════
//  PRODUCTION
// ═══════════════════════════════════════════════
function tickProduction(){
  const s=SEASONS[G.seasonIdx];
  const base={wood:6,stone:4,food:8,gold:2};
  Object.entries(base).forEach(([r,v])=>{G.resources[r]=(G.resources[r]||0)+Math.floor(v*s.prod)});
  updateRes();
}

// ═══════════════════════════════════════════════
//  EVENTS LOG
// ═══════════════════════════════════════════════
function addEventLog(text,cls){
  const log=document.getElementById('events-log');
  const el=document.createElement('div');
  el.className=`ev-line ${cls||''}`;el.textContent=text;
  log.insertBefore(el,log.firstChild);
  setTimeout(()=>el.remove(),5000);
  if(log.children.length>6)[...log.children].slice(6).forEach(c=>c.remove());
}

// ═══════════════════════════════════════════════
//  UI UTILS
// ═══════════════════════════════════════════════
function updateRes(){
  ['wood','stone','food','gold','runes','mead'].forEach(k=>{
    const el=document.getElementById('r-'+k);if(el)el.textContent=Math.floor(G.resources[k]||0);
  });
}
function updateMoral(){
  const m=G.moral,col=m>=60?'#6aaa50':m>=30?'#d4a017':'#e74c3c';
  const bar=document.getElementById('moral-bar'),val=document.getElementById('moral-val');
  if(bar){bar.style.width=m+'%';bar.style.background=col}
  if(val){val.textContent=m;val.style.color=col}
  const gv=document.getElementById('glory-val');if(gv)gv.textContent=G.glory;
}
function toast(msg,type){
  const c=document.getElementById('toasts');const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');el.textContent=msg;c.appendChild(el);setTimeout(()=>el.remove(),4000);
}
function toggleLegend(){document.getElementById('kingdom-legend').classList.toggle('hidden')}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
function init(){
  G.grid=generateGrid();
  // Explorer autour du village de départ
  exploreAround(G.playerCell.x,G.playerCell.y,3);
  exploreAround(5,11,2); // Village allié
  renderGrid();
  updateSeasonUI();updateRes();updateMoral();
  centerOnVillage();
  // Boucle principale
  setInterval(()=>{
    G.tick++;
    if(G.tick%8===0){tickProduction();updateMoral();}
    if(G.tick%20===0){tickAI();}
    // Avancer les jours
    if(G.tick%60===0){
      G.day++;
      document.getElementById('day-counter').textContent=`Jour ${G.day}`;
      const dn=document.getElementById('day-num');if(dn)dn.textContent=G.day;
      if(G.day%28===0){
        G.seasonIdx=(G.seasonIdx+1)%4;
        updateSeasonUI();
        addEventLog(`${SEASONS[G.seasonIdx].icon} Nouvelle saison : ${SEASONS[G.seasonIdx].label} !`,'divine');
        toast(`${SEASONS[G.seasonIdx].icon} ${SEASONS[G.seasonIdx].label} commence !`,'divine');
      }
    }
  },1000);
  // Messages de bienvenue
  setTimeout(()=>{
    toast('🗺 Cliquez sur une case pour l\'explorer','info');
    addEventLog('🌳 Bienvenue dans Yggdrasil','divine');
  },600);
  setTimeout(()=>toast('🍂 Automne : constituez vos provisions !','d'),1600);
  setTimeout(()=>{
    addEventLog('⚔ Clan Ulfhéðnar repéré au nord-est','hostile');
    addEventLog('🤝 Alliance Sólveig envoie des salutations','good');
  },2500);
}

init();
</script>
